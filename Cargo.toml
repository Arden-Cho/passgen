[package]
name = "passgen"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Arden-Cho/passgen"
authors = ["Arden-Cho"]
description = "A password generator"
homepage = "https://github.com/Arden-Cho/passgen"

[package.metadata.wix]
upgrade-guid = "4C8BBFD7-76F2-45F2-8E1A-492DD0FF73E5"
path-guid = "7F3FCF19-6B6F-48C1-8F1F-026E89777526"
license = false
eula = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
getrandom = "0.4.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat" # modified by me
