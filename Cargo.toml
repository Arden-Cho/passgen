[package]
name = "passgen"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Arden-Cho/passgen"
authors = ["Arden-Cho"]
description = "A password generator"
homepage = "https://github.com/Arden-Cho/passgen"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
getrandom = "0.4.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
